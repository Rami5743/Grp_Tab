<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>טבלה מחזורית של החבורות הפשוטות הסופיות</title>
<meta name="description" content="כרזה בת עמוד אחד שבה כל חבורה פשוטה סופית מופיעה בדיוק פעם אחת.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<style>
  html, body { margin: 0; height: 100%; background: #fcfcfb; }
  @media (prefers-color-scheme: dark) { html, body { background: #141413; } }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #121212; }

  .poster-embed { display: block; width: 100%; height: 100%; border: 0; }

  .plain {
    display: none;
    min-height: 100%;
    padding: 2rem 16px;
    text-align: center;
  }
  .plain img { width: 100%; height: auto; border-radius: 8px; }
  .plain a {
    display: inline-block; margin-top: 1.25rem;
    padding: 0.7rem 1.4rem; border-radius: 10px;
    background: #2a78d6; color: #fff; text-decoration: none; font-weight: 600;
  }

  /* A touch device will not scroll a PDF embedded in a page, so it gets the
     picture and a link to the file instead. */
  @media (pointer: coarse), (max-width: 820px) {
    .poster-embed { display: none; }
    .plain { display: block; }
  }
</style>
<script async src="https://rami5743.github.io/count.js"></script>
</head>
<body>

<object class="poster-embed" data="out/finite_simple_groups.pdf#view=Fit" type="application/pdf" title="טבלה מחזורית של החבורות הפשוטות הסופיות">
  <div class="plain" style="display:block">
    <img src="site/poster-preview.png" width="2456" height="1081" alt="הכרזה">
    <a href="out/finite_simple_groups.pdf">פתיחת הכרזה</a>
  </div>
</object>

<div class="plain">
  <img src="site/poster-preview.png" width="2456" height="1081" alt="הכרזה">
  <a href="out/finite_simple_groups.pdf">פתיחת הכרזה</a>
</div>

</body>
</html>
